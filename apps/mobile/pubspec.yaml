name: zeus_mobile
description: Mobile control plane for Zeus AI agent sessions.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  rive: ^0.14.11
  sf_symbols: ^0.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  flutter_gen_runner: ^5.15.0

flutter_gen:
  output: lib/gen/
  line_length: 100
  integrations:
    image: true
    rive: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/rive/
