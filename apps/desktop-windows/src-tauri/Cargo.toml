[workspace]
members = ["crates/zeus-engine"]

[package]
name = "zeus-desktop"
version = "0.1.0"
description = "Zeus desktop agent control island"
authors = ["Zeus contributors"]
edition = "2021"

[lib]
name = "zeus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeus-engine = { path = "crates/zeus-engine" }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
ureq = { version = "3.4.2", default-features = false, features = ["json", "rustls", "platform-verifier"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Media_Control",
    "Foundation",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
] }
